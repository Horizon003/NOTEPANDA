name: Deploy Hyzen web preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-preview.yml'
      - 'hyzen_flutter/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH_API_BASE: ${{ vars.HYZEN_PUSH_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the configured production backend URL
        run: python tools/ci/validate_push_url.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - name: Build browser preview
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build web --release --no-pub --base-href "/pharm-d-with-hyzen/" --dart-define=HYZEN_APP_VERSION="$version" --dart-define=PUSH_API_BASE="$PUSH_API_BASE"
        working-directory: hyzen_flutter
      - name: Add SPA fallback
        run: cp hyzen_flutter/build/web/index.html hyzen_flutter/build/web/404.html
      - name: Checkout PR 18 source at its tested revision
        uses: actions/checkout@v4
        with:
          ref: 926208fa7965017a203bdf8d50f214d54423c3ec
          path: preview-source
          persist-credentials: false
      - name: Build isolated PR 18 Flutter Web review
        working-directory: preview-source/hyzen_flutter
        run: |
          flutter pub get
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          flutter build web --release --pwa-strategy=none --no-web-resources-cdn \
            --target lib/main_account_review.dart \
            --base-href "/pharm-d-with-hyzen/preview/app/" \
            --dart-define=HYZEN_REVIEW_ROUTE=/home \
            --dart-define=HYZEN_APP_VERSION="$version"
      - name: Bundle PR 18 preview alongside existing production site
        run: |
          mkdir -p hyzen_flutter/build/web/preview/app
          cp -a preview-source/hyzen_flutter/build/web/. hyzen_flutter/build/web/preview/app/
          cp preview-source/tools/live_preview/index.html hyzen_flutter/build/web/preview/index.html
          printf '%s\n' 926208fa7965017a203bdf8d50f214d54423c3ec > hyzen_flutter/build/web/preview/source-commit.txt
          test -s hyzen_flutter/build/web/preview/app/main.dart.js
          test -s hyzen_flutter/build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hyzen_flutter/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

