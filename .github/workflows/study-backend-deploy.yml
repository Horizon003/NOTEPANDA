name: Deploy verified study rewards and calendar backend
on:
  push:
    branches: [work/monochrome-motion-1.5.5]
    paths: ['.github/workflows/study-backend-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-backend-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts && npm test && npx wrangler deploy --dry-run --outdir dist
        working-directory: push-worker
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require existing account deployment access
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci --ignore-scripts
        working-directory: push-worker
      - run: npm test
        working-directory: push-worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: push-worker
      - name: Add only new reward and calendar tables
        run: npx wrangler d1 execute hyzen-push --remote --file migrations/0002_rewards_calendar.sql
        working-directory: push-worker
      - name: Deploy worker while retaining production secrets and variables
        run: npx wrangler deploy --keep-vars
        working-directory: push-worker
      - name: Require authentication on the new endpoints
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          base='https://hyzen-onesignal-sender.harisaslam003.workers.dev'
          for route in ['rewardState','claimReward','rewardPulse','calendarEvents']:
              request=urllib.request.Request(base+'/'+route,data=b'{"data":{}}',headers={'Content-Type':'application/json'})
              try:
                  urllib.request.urlopen(request)
                  raise AssertionError('Unauthenticated endpoint accepted a request: '+route)
              except urllib.error.HTTPError as error:
                  assert error.code == 401, (route,error.code)
          print('New endpoints require authentication')
          PY
