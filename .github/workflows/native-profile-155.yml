name: Native Flutter 1.5.5 profile verification
on:
  workflow_dispatch:
  push:
    branches: [work/monochrome-motion-1.5.5]
    paths: ['.github/workflows/native-profile-155.yml']
permissions:
  contents: read
concurrency:
  group: native-profile-155
  cancel-in-progress: true
jobs:
  native-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PDFIUM_MIRROR_DIR: ${{ github.workspace }}/tools/ci/pdfium
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc /usr/share/swift
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true
      - run: flutter pub get
        working-directory: hyzen_flutter
      - run: python tools/ci/patch_pdfrx_download.py
      - run: python tools/ci/prepare_gradle.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          working-directory: hyzen_flutter
          script: flutter drive --profile --no-dds --driver=test_driver/monochrome_profile.dart --target=integration_test/monochrome_profile_test.dart --dart-define=HYZEN_REVIEW_ROUTE=/home
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monochrome-native-profile
          path: |
            hyzen_flutter/qa/monochrome/native/
            hyzen_flutter/build/integration_response_data.json
          if-no-files-found: warn
